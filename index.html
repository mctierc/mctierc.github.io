<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCTierc · PVP 段位排行榜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <script src="data.js?v=20241108c"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0b0e;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #e8edf5;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
        }
        .app {
            max-width: 100%;
            width: 100%;
            background: #14171c;
            border-radius: 0;
            box-shadow: none;
            padding: 20px 24px 28px;
            border: none;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px 12px;
            padding: 0 4px 16px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .logo { display: flex; align-items: center; line-height: 1; }
        .logo img { height: 44px; width: auto; display: block; }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            font-weight: 500;
            font-size: 15px;
            color: #8899bb;
        }
        .nav-links span,
        .nav-links a {
            cursor: pointer;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            text-decoration: none;
            color: #8899bb;
        }
        .nav-links span.active,
        .nav-links a.active {
            color: #d0d8e8;
            border-bottom-color: #9966ff;
        }
        .nav-links span:not(.active):hover,
        .nav-links a:not(.active):hover { color: #d0d8e8; }

        .nav-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .search-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1a1f2a;
            padding: 2px 8px 2px 12px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .search-area input[type="text"] {
            border: none;
            background: transparent;
            padding: 4px 0;
            font-size: 13px;
            width: 110px;
            outline: none;
            color: #e8edf5;
        }
        .search-area input::placeholder { color: #6a7a9a; font-weight: 400; font-size: 12px; }
        .search-area .search-btn {
            background: transparent;
            border: none;
            color: #8ab4ff;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 4px;
            font-size: 14px;
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0 14px;
            background: #0d0f14;
            padding: 0;
            border-radius: 0;
            border: none;
            flex-wrap: wrap;
            gap: 0;
            overflow-x: auto;
        }
        .tabs-left { display: flex; flex-wrap: wrap; align-items: center; gap: 0; width: 100%; }
        .tab-item {
            padding: 10px 16px;
            font-weight: 600;
            font-size: 13px;
            background: transparent;
            color: #6a7a9a;
            transition: 0.2s;
            cursor: pointer;
            white-space: nowrap;
            border: none;
            border-bottom: 2px solid transparent;
            flex: none;
            text-align: center;
            min-width: 60px;
            margin: 0;
        }
        .tab-item.active { color: #d0d8e8; border-bottom-color: #9966ff; background: transparent; }
        .tab-item:hover:not(.active) { color: #8899bb; background: rgba(255, 255, 255, 0.02); }
        .tabs-right { font-size: 12px; color: #6a7a9a; padding-right: 4px; }

        .panel {
            background: #0d0f14;
            padding: 12px 8px 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 4px;
            border-radius: 0;
        }
        .table-wrap { overflow-x: auto; background: #0d0f14; border-radius: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
        th {
            text-align: left;
            padding: 12px 10px;
            font-weight: 600;
            color: #6a7a9a;
            background: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.03em;
            font-size: 11px;
            text-transform: uppercase;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #d0d8e8;
            vertical-align: middle;
        }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .rank-badge {
            display: inline-block;
            font-weight: 700;
            font-size: 18px;
            min-width: 44px;
            text-align: center;
            color: #ffffff;
            padding: 4px 16px 4px 8px;
            clip-path: polygon(0% 0%, 100% 0%, 82% 100%, 0% 100%);
            background: #1a1f2a;
            border: none;
            line-height: 32px;
            height: 38px;
            padding-left: 6px;
            padding-right: 18px;
            letter-spacing: 0.5px;
        }
        .rank-badge::after {
            content: ".";
            font-weight: 700;
            font-size: 18px;
            color: #ffffff;
            margin-left: 1px;
        }
        .rank-badge.gold { background: linear-gradient(135deg, #ffd700, #f5a623); color: #ffffff; }
        .rank-badge.gold::after { color: #ffffff; }
        .rank-badge.silver { background: linear-gradient(135deg, #d0d5e0, #a8b0c0); color: #ffffff; }
        .rank-badge.silver::after { color: #ffffff; }
        .rank-badge.bronze { background: linear-gradient(135deg, #e8b88a, #c9946a); color: #ffffff; }
        .rank-badge.bronze::after { color: #ffffff; }

        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 16px 8px 8px;
            font-size: 13px;
            color: #6a7a9a;
        }
        .pagination button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: 500;
            color: #8899bb;
            cursor: pointer;
            transition: 0.15s;
        }
        .pagination button:hover { background: #1a1f2a; border-color: rgba(255, 255, 255, 0.1); color: #e8edf5; }
        .pagination .page-info { background: #1a1f2a; padding: 4px 14px; border-radius: 6px; color: #8899bb; }
        .empty-message { text-align: center; padding: 40px 20px; color: #6a7a9a; font-weight: 500; }

        .clickable-name { cursor: pointer; font-weight: 600; color: #d0d8e8; transition: 0.15s; }
        .clickable-name:hover { color: #8ab4ff; }

        .tag-站主 {
            display: inline-block;
            background: #ff4444;
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 4px;
            margin-left: 4px;
            border: 1px solid #cc0000;
            vertical-align: middle;
        }
        .tag-测试官 {
            display: inline-block;
            background: #4a8cff;
            color: white;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 4px;
            margin-left: 4px;
            border: 1px solid #0066cc;
            vertical-align: middle;
        }

        .title-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 4px;
            margin-left: 0;
            vertical-align: middle;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .title-grandmaster { background: linear-gradient(135deg, #ffd700, #f5a623); color: #3d2b00; border-color: #ffd700; }
        .title-master { background: linear-gradient(135deg, #ffe066, #ffcc00); color: #3d2b00; border-color: #ffcc00; }
        .title-ace { background: linear-gradient(135deg, #ff5555, #cc0000); color: #ffffff; border-color: #cc0000; }
        .title-specialist { background: linear-gradient(135deg, #c9a0ff, #9966ff); color: #2a1a4a; border-color: #9966ff; }
        .title-cadet { background: linear-gradient(135deg, #a0d8ff, #66b3ff); color: #0a2a4a; border-color: #66b3ff; }
        .title-novice { background: #6a7a9a; color: #ffffff; border-color: #5a6a8a; }
        .title-rookie { background: #e8edf5; color: #2a2a2a; border-color: #d0d8e8; }

        .level-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 36px;
        }
        .level-circle .circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            background: #0d0f14;
            border: 2px solid #6a7a9a;
            color: #6a7a9a;
            transition: 0.15s;
        }
        .level-circle .circle .mode-icon img {
            width: 18px;
            height: 18px;
            object-fit: contain;
            display: block;
        }
        .level-circle .circle.level-S { border-color: #ffd700; color: #ffd700; }
        .level-circle .circle.level-A { border-color: #c0c8d8; color: #c0c8d8; }
        .level-circle .circle.level-B { border-color: #cd7f32; color: #cd7f32; }
        .level-circle .circle.level-C { border-color: #b794f6; color: #b794f6; }
        .level-circle .circle.level-D { border-color: #8f9bb5; color: #8f9bb5; }
        .level-circle .circle .mode-icon {
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .level-circle .level-text {
            font-size: 10px;
            margin-top: 2px;
            white-space: nowrap;
            font-weight: 700;
            color: #8f9bb5;
        }
        .level-text.text-tier-1 { color: #ffd700; }
        .level-text.text-tier-2 { color: #c0c8d8; }
        .level-text.text-tier-3 { color: #cd7f32; }
        .level-text.text-tier-4 { color: #b794f6; }
        .level-text.text-tier-5 { color: #8f9bb5; }

        .mode-view-container {
            display: none;
            background: #0d0f14;
            border-radius: 0;
            padding: 12px 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 4px;
        }
        .mode-view-container.active { display: block; }

        .mode-level-bars { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .mode-level-bar {
            flex: 1;
            min-width: 70px;
            max-width: 20%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: #0d0f14;
            border-radius: 0;
            padding: 10px 8px 12px;
            border: 1.5px solid rgba(255,255,255,0.15);
        }
        .mode-level-bar .level-label {
            font-weight: 700;
            font-size: 18px;
            color: #8ab4ff;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        .mode-level-bar .level-players {
            font-size: 12px;
            color: #8899bb;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: stretch;
        }
        .mode-level-bar .level-players .player-name-item {
            padding: 3px 6px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.1s;
            font-size: 12px;
            font-weight: 500;
            color: #d0d8e8;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mode-level-bar .level-players .player-name-item:hover { background: #1a1f2a; color: #8ab4ff; }
        .mode-level-bar .level-players .player-name-item .sub-level {
            font-size: 9px;
            font-weight: 600;
            color: #6a7a9a;
            background: #1a1f2a;
            padding: 0 6px;
            border-radius: 4px;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .mode-level-bar .level-players .empty-level {
            color: #5a6a8a;
            font-size: 12px;
            padding: 12px 0;
            text-align: center;
        }

        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .player-modal.active { display: flex; }

        .player-modal-card {
            background: #14171c;
            border-radius: 16px;
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .player-modal-card .player-header {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        .player-modal-card .player-header h2 { font-size: 22px; color: #e8edf5; }
        .player-modal-card .player-rank { font-size: 13px; color: #ffd700; font-weight: 600; margin-bottom: 2px; }
        .player-modal-card .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 14px;
            margin: 10px 0 14px;
        }
        .player-modal-card .mode-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
        }
        .player-modal-card .mode-item .mode-name {
            color: #8899bb;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .player-modal-card .mode-item .mode-name img { width: 18px; height: 18px; object-fit: contain; }
        .player-modal-card .mode-item .mode-level { font-weight: 600; color: #8ab4ff; }
        .player-modal-card .close-modal-btn {
            margin-top: 12px;
            background: #1a1f2a;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 32px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #d0d8e8;
            transition: 0.15s;
            width: 100%;
        }
        .player-modal-card .close-modal-btn:hover { background: #2a3448; color: #e8edf5; }
        .player-modal-card .total-score-display {
            font-size: 16px;
            font-weight: 700;
            color: #8ab4ff;
            text-align: center;
            padding: 6px 0;
            background: #0d0f14;
            border-radius: 8px;
            margin: 4px 0 10px;
        }

        @media (max-width: 860px) {
            body { padding: 12px; }
            .navbar { flex-direction: column; align-items: stretch; }
            .nav-links { flex-wrap: wrap; gap: 12px; }
            .nav-right { width: 100%; flex-direction: column; }
            .search-area { width: 100%; }
            .search-area input { width: 100%; }
            .tabs-bar { flex-direction: column; align-items: stretch; }
            .tabs-left { flex-wrap: wrap; }
            .mode-level-bars { gap: 4px; }
            .mode-level-bar { min-width: 40px; padding: 6px 4px; }
            .mode-level-bar .level-label { font-size: 14px; }
            .mode-level-bar .level-players .player-name-item { font-size: 10px; padding: 2px 4px; }
            .player-modal-card { padding: 20px; }
            table { font-size: 12px; }
            th, td { padding: 8px 6px; }
            .tab-item { padding: 8px 12px; font-size: 12px; min-width: 50px; }
            .rank-badge { font-size: 16px; min-width: 38px; height: 34px; line-height: 28px; padding-right: 14px; }
            .rank-badge::after { font-size: 16px; }
            .level-circle .circle { width: 28px; height: 28px; font-size: 14px; }
            .level-circle .level-text { font-size: 9px; }
            .level-circle .circle .mode-icon img { width: 16px; height: 16px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="navbar">
            <div class="logo">
                <img src="https://pic1.imgdb.cn/i/0341tNBdZe2zyAMVNAeoAC.png" alt="MCTierc" style="height:32px; width:auto; display:block;" />
            </div>
            <div class="nav-links">
                <span class="active" id="navHome">首页</span>
                <a href="about.html" id="navAbout">关于</a>
            </div>
            <div class="nav-right">
                <div class="search-area">
                    <input type="text" id="playerSearch" placeholder="搜索玩家..." />
                    <button class="search-btn" id="searchBtn">🔍</button>
                </div>
            </div>
        </header>

        <div class="tabs-bar">
            <div class="tabs-left" id="tabsLeft"></div>
            <div class="tabs-right"></div>
        </div>

        <div class="panel" id="panelTotal">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:56px;text-align:center;">#</th>
                            <th style="white-space:nowrap;">PLAYER</th>
                            <th style="white-space:nowrap;">TITLE</th>
                            <th style="text-align:center;white-space:nowrap;">POINTS</th>
                            <th>TIERS</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" class="empty-message">暂无玩家数据</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="paginationControls">
                <button id="prevPage">←</button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button id="nextPage">→</button>
            </div>
        </div>

        <div class="mode-view-container" id="modeViewContainer">
            <div class="mode-level-bars" id="modeLevelBars"></div>
        </div>
    </div>

    <div class="player-modal" id="playerModal">
        <div class="player-modal-card">
            <div class="player-header" style="justify-content: space-between; align-items: flex-start;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <h2 id="modalPlayerName"></h2>
                    <span id="modalPlayerTag"></span>
                </div>
                <div id="modalPlayerTitle" style="flex-shrink:0;"></div>
            </div>
            <div class="player-rank" id="modalPlayerRank"></div>
            <div class="total-score-display" id="modalTotalScore">总分: 0</div>
            <div class="mode-grid" id="modalModeGrid"></div>
            <button class="close-modal-btn" id="closeModalBtn">关闭</button>
        </div>
    </div>

    <script>
        (function() {
            const DATA = window.__DATA;
            if (!DATA) {
                console.error('数据文件未加载！请确保 data.js 存在且已正确引入。');
                return;
            }

            const MODES = DATA.MODES;
            const LEVEL_SCORES = DATA.LEVEL_SCORES;
            const MODE_INFO = DATA.MODE_INFO;
            const MODE_ICONS = DATA.MODE_ICONS;
            const OVERALL_ICON = DATA.OVERALL_ICON;
            let players = JSON.parse(JSON.stringify(DATA.PLAYERS));

            let selectedMode = null;
            let currentPage = 1;
            const pageSize = 50;
            let filteredPlayers = [];

            const LEVELS = Object.keys(LEVEL_SCORES);
            const SORTED_LEVELS = [...LEVELS].sort((a, b) => LEVEL_SCORES[b] - LEVEL_SCORES[a]);
            const MAIN_LEVELS = ['HT1', 'HT2', 'HT3', 'HT4', 'HT5'];

            const LEVEL_WEIGHT = {
                'HT1': 0, 'LT1': 1,
                'HT2': 2, 'LT2': 3,
                'HT3': 4, 'LT3': 5,
                'HT4': 6, 'LT4': 7,
                'HT5': 8, 'LT5': 9
            };

            let globalRankMap = new Map();

            function calculateTotalScore(player, modeFilter) {
                const modesToUse = modeFilter ? [modeFilter] : MODES;
                let total = 0;
                for (const mode of modesToUse) {
                    const level = player.modes[mode];
                    if (level && LEVEL_SCORES.hasOwnProperty(level)) {
                        total += LEVEL_SCORES[level];
                    }
                }
                return total;
            }

            function getTitle(totalScore) {
                if (totalScore >= 400) return { name: 'Combat Grandmaster', cls: 'title-grandmaster' };
                if (totalScore >= 250) return { name: 'Combat Master', cls: 'title-master' };
                if (totalScore >= 100) return { name: 'Combat Ace', cls: 'title-ace' };
                if (totalScore >= 50) return { name: 'Combat Specialist', cls: 'title-specialist' };
                if (totalScore >= 20) return { name: 'Combat Cadet', cls: 'title-cadet' };
                if (totalScore >= 10) return { name: 'Combat Novice', cls: 'title-novice' };
                return { name: 'Rookie', cls: 'title-rookie' };
            }

            function renderTitleBadge(totalScore) {
                const t = getTitle(totalScore);
                return `<span class="title-badge ${t.cls}">${t.name}</span>`;
            }

            function getModeLevel(player, mode) {
                return player.modes[mode] || '-';
            }

            function getMainLevel(level) {
                if (!level || level === '-') return '-';
                const m = level.match(/^(HT|LT)(\d)$/);
                if (!m) return '-';
                return 'HT' + m[2];
            }

            function getLevelTextClass(level) {
                if (!level || level === '-') return '';
                const m = level.match(/^(HT|LT)(\d)$/);
                if (!m) return '';
                return 'text-tier-' + m[2];
            }

            function calculateGlobalRanks() {
                const allPlayersWithScore = players.map(p => {
                    const total = calculateTotalScore(p, null);
                    return { ...p, _totalScore: total };
                });
                allPlayersWithScore.sort((a, b) => b._totalScore - a._totalScore);

                const rankMap = new Map();
                let currentRank = 1;
                for (let i = 0; i < allPlayersWithScore.length; i++) {
                    if (i === 0) {
                        rankMap.set(allPlayersWithScore[i].name, currentRank);
                    } else {
                        if (allPlayersWithScore[i]._totalScore === allPlayersWithScore[i - 1]._totalScore) {
                            rankMap.set(allPlayersWithScore[i].name, currentRank);
                        } else {
                            currentRank = i + 1;
                            rankMap.set(allPlayersWithScore[i].name, currentRank);
                        }
                    }
                }
                return rankMap;
            }

            function renderTag(tag) {
                if (!tag || tag.length === 0) return '';
                const tags = [];
                for (const item of tag) {
                    if (item === '管理员') {
                        tags.push(`<span class="tag-站主">管理员</span>`);
                        continue;
                    }
                    const matchedMode = MODES.find(mode => item === mode);
                    if (matchedMode) {
                        tags.push(`<span class="tag-测试官">${matchedMode}</span>`);
                    }
                }
                return tags.join('');
            }

            function isImageUrl(url) {
                return url && (url.startsWith('http') || url.startsWith('data:image') || url.includes('.png') || url.includes('.jpg') || url.includes('.jpeg') || url.includes('.svg') || url.includes('.webp'));
            }

            function getModeIconHtml(mode, size) {
                const icon = MODE_ICONS[mode] || '';
                size = size || 18;
                if (isImageUrl(icon)) {
                    return `<img src="${icon}" style="width:${size}px;height:${size}px;object-fit:contain;display:block;" />`;
                }
                return icon;
            }

            function getModeLabel(mode) {
                const icon = MODE_ICONS[mode] || '';
                if (isImageUrl(icon)) {
                    return `<img src="${icon}" style="width:18px;height:18px;object-fit:contain;display:inline-block;vertical-align:middle;margin-right:4px;border-radius:2px;" /> ${mode}`;
                }
                return icon + ' ' + mode;
            }

            function renderTabs() {
                const container = document.getElementById('tabsLeft');
                container.innerHTML = '';

                const allModeBtn = document.createElement('span');
                allModeBtn.className = 'tab-item' + (selectedMode === null ? ' active' : '');
                allModeBtn.innerHTML =
                    `<img src="${OVERALL_ICON}" style="width:20px;height:20px;object-fit:contain;vertical-align:middle;margin-right:4px;" /> Overall`;
                allModeBtn.dataset.mode = '';
                allModeBtn.addEventListener('click', function() {
                    selectedMode = null;
                    renderTabs();
                    applyFilters();
                });
                container.appendChild(allModeBtn);

                MODES.forEach(mode => {
                    const btn = document.createElement('span');
                    btn.className = 'tab-item' + (selectedMode === mode ? ' active' : '');
                    btn.innerHTML = getModeLabel(mode);
                    btn.dataset.mode = mode;
                    btn.addEventListener('click', function() {
                        selectedMode = (selectedMode === mode) ? null : mode;
                        renderTabs();
                        applyFilters();
                    });
                    container.appendChild(btn);
                });
            }

            function renderModeLevelBars(mode) {
                const container = document.getElementById('modeLevelBars');
                container.innerHTML = '';

                if (!mode) {
                    document.getElementById('modeViewContainer').classList.remove('active');
                    document.getElementById('panelTotal').style.display = 'block';
                    return;
                }

                document.getElementById('modeViewContainer').classList.add('active');
                document.getElementById('panelTotal').style.display = 'none';

                const mainLevelMap = { 'HT1': [], 'HT2': [], 'HT3': [], 'HT4': [], 'HT5': [] };
                players.forEach(p => {
                    const level = p.modes[mode];
                    if (level && level !== '-') {
                        const main = getMainLevel(level);
                        if (main && mainLevelMap[main]) {
                            mainLevelMap[main].push({
                                name: p.name,
                                subLevel: level
                            });
                        }
                    }
                });

                MAIN_LEVELS.forEach(lv => {
                    if (mainLevelMap[lv]) {
                        mainLevelMap[lv].sort((a, b) => {
                            const wa = LEVEL_WEIGHT[a.subLevel] ?? 99;
                            const wb = LEVEL_WEIGHT[b.subLevel] ?? 99;
                            return wa - wb;
                        });
                    }
                });

                MAIN_LEVELS.forEach(lv => {
                    const bar = document.createElement('div');
                    bar.className = 'mode-level-bar';
                    const label = document.createElement('div');
                    label.className = 'level-label';
                    label.textContent = lv;
                    bar.appendChild(label);

                    const playersDiv = document.createElement('div');
                    playersDiv.className = 'level-players';
                    const items = mainLevelMap[lv] || [];
                    if (items.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'empty-level';
                        empty.textContent = '—';
                        playersDiv.appendChild(empty);
                    } else {
                        items.forEach(({ name, subLevel }) => {
                            const span = document.createElement('span');
                            span.className = 'player-name-item';
                            span.innerHTML = `
                            <span>${name}</span>
                            <span class="sub-level">${subLevel}</span>
                        `;
                            span.addEventListener('click', function(e) {
                                e.stopPropagation();
                                const player = players.find(p => p.name === name);
                                if (player) showPlayerModal(player);
                            });
                            playersDiv.appendChild(span);
                        });
                    }
                    bar.appendChild(playersDiv);
                    container.appendChild(bar);
                });
            }

            function applyFilters() {
                const searchInput = document.getElementById('playerSearch');
                const searchTerm = searchInput.value.trim().toLowerCase();

                globalRankMap = calculateGlobalRanks();

                let filtered = players.filter(p => {
                    if (searchTerm !== '') {
                        const matchName = p.name.toLowerCase().includes(searchTerm);
                        if (!matchName) return false;
                    }
                    return true;
                });

                if (selectedMode) {
                    filtered = filtered.filter(p => {
                        const lv = p.modes[selectedMode];
                        return lv && lv !== '-';
                    });
                }

                const withScore = filtered.map(p => {
                    const total = calculateTotalScore(p, selectedMode);
                    return { ...p, _totalScore: total };
                });

                withScore.sort((a, b) => b._totalScore - a._totalScore);
                filteredPlayers = withScore;
                currentPage = 1;

                renderModeLevelBars(selectedMode);

                if (selectedMode === null) {
                    document.getElementById('panelTotal').style.display = 'block';
                    document.getElementById('modeViewContainer').classList.remove('active');
                    renderTable();
                } else {
                    document.getElementById('panelTotal').style.display = 'none';
                    document.getElementById('modeViewContainer').classList.add('active');
                }
            }

            function getRankClass(rank) {
                if (rank === 1) return 'gold';
                if (rank === 2) return 'silver';
                if (rank === 3) return 'bronze';
                return '';
            }

            function getLevelCircleClass(level) {
                if (!level || level === '-') return 'level-gray';
                const m = level.match(/^(HT|LT)(\d)$/);
                if (!m) return 'level-gray';
                const num = m[2];
                if (num === '1') return 'level-S';
                if (num === '2') return 'level-A';
                if (num === '3') return 'level-B';
                if (num === '4') return 'level-C';
                return 'level-D';
            }

            function renderTable() {
                const tbody = document.getElementById('tableBody');
                const totalItems = filteredPlayers.length;
                const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
                if (currentPage > totalPages) currentPage = totalPages;

                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, totalItems);
                const pageItems = filteredPlayers.slice(start, end);

                document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;

                if (pageItems.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="empty-message">暂无匹配的玩家数据</td></tr>`;
                    return;
                }

                let html = '';
                pageItems.forEach((player, idx) => {
                    const rank = globalRankMap.get(player.name) || (start + idx + 1);
                    const totalScore = player._totalScore;
                    const rankClass = getRankClass(rank);

                    let modeTagsHtml = '';
                    const modeLevels = [];
                    MODES.forEach(mode => {
                        const level = getModeLevel(player, mode);
                        if (level !== '-') {
                            modeLevels.push({ mode, level });
                        }
                    });
                    modeLevels.sort((a, b) => {
                        const scoreA = LEVEL_SCORES[a.level] ?? -1;
                        const scoreB = LEVEL_SCORES[b.level] ?? -1;
                        return scoreB - scoreA;
                    });

                    if (modeLevels.length === 0) {
                        modeTagsHtml = '<span style="color:#5a6a8a;font-size:12px;">无等级</span>';
                    } else {
                        modeTagsHtml = '<div style="display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;">';
                        modeLevels.forEach(({ mode, level }) => {
                            const iconHtml = getModeIconHtml(mode, 18);
                            const circleClass = getLevelCircleClass(level);
                            const textClass = getLevelTextClass(level);
                            modeTagsHtml += `
                            <div class="level-circle">
                                <div class="circle ${circleClass}">
                                    <span class="mode-icon">${iconHtml}</span>
                                </div>
                                <span class="level-text ${textClass}">${level}</span>
                            </div>
                        `;
                        });
                        modeTagsHtml += '</div>';
                    }

                    html += `
                    <tr>
                        <td style="text-align:center;width:56px;padding-left:2px;padding-right:2px;">
                            <span class="rank-badge ${rankClass}">${rank}</span>
                        </td>
                        <td style="white-space:nowrap;padding-right:6px;">
                            <span class="clickable-name" onclick="window.__MCTierC.showPlayerModalByName('${player.name}')">${player.name}</span>
                            ${renderTag(player.tag)}
                        </td>
                        <td style="white-space:nowrap;">${renderTitleBadge(totalScore)}</td>
                        <td style="text-align:center;white-space:nowrap;font-weight:600;color:#8ab4ff;padding-left:6px;padding-right:6px;">${totalScore}</td>
                        <td style="max-width:400px;">${modeTagsHtml}</td>
                    </tr>
                `;
                });

                tbody.innerHTML = html;
                document.getElementById('prevPage').disabled = (currentPage === 1);
                document.getElementById('nextPage').disabled = (currentPage === totalPages);
            }

            function goToPage(page) {
                const totalItems = filteredPlayers.length;
                const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
                if (page < 1) page = 1;
                if (page > totalPages) page = totalPages;
                currentPage = page;
                renderTable();
            }

            function showPlayerModal(player) {
                const modal = document.getElementById('playerModal');
                document.getElementById('modalPlayerName').textContent = player.name;
                document.getElementById('modalPlayerTag').innerHTML = renderTag(player.tag);

                const globalRank = globalRankMap.get(player.name);
                if (globalRank) {
                    let rankDisplay = globalRank;
                    if (globalRank === 1) rankDisplay = '🥇 1';
                    else if (globalRank === 2) rankDisplay = '🥈 2';
                    else if (globalRank === 3) rankDisplay = '🥉 3';
                    document.getElementById('modalPlayerRank').textContent = '总排名: ' + rankDisplay;
                } else {
                    document.getElementById('modalPlayerRank').textContent = '总排名: 未上榜';
                }

                const total = calculateTotalScore(player, null);
                document.getElementById('modalPlayerTitle').innerHTML = renderTitleBadge(total);
                document.getElementById('modalTotalScore').textContent = '总分: ' + total;

                const grid = document.getElementById('modalModeGrid');
                grid.innerHTML = '';
                MODES.forEach(mode => {
                    const level = getModeLevel(player, mode);
                    const iconHtml = getModeIconHtml(mode, 18);
                    const div = document.createElement('div');
                    div.className = 'mode-item';
                    div.innerHTML = `
                    <span class="mode-name">${iconHtml} ${mode}</span>
                    <span class="mode-level">${level}</span>
                `;
                    grid.appendChild(div);
                });

                modal.classList.add('active');
            }

            function closePlayerModal() {
                document.getElementById('playerModal').classList.remove('active');
            }

            function showPlayerModalByName(name) {
                const player = players.find(p => p.name === name);
                if (player) showPlayerModal(player);
            }

            document.addEventListener('DOMContentLoaded', function() {
                globalRankMap = calculateGlobalRanks();

                renderTabs();

                const topSearchBtn = document.getElementById('searchBtn');
                const topSearchInput = document.getElementById('playerSearch');
                topSearchBtn.addEventListener('click', applyFilters);
                topSearchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') applyFilters(); });

                document.getElementById('prevPage').addEventListener('click', () => goToPage(currentPage - 1));
                document.getElementById('nextPage').addEventListener('click', () => goToPage(currentPage + 1));

                document.getElementById('closeModalBtn').addEventListener('click', closePlayerModal);
                document.getElementById('playerModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closePlayerModal();
                });

                document.getElementById('navHome').addEventListener('click', function() {
                    document.querySelector('.panel').scrollIntoView({ behavior: 'smooth' });
                });

                applyFilters();
            });

            window.__MCTierC = {
                players,
                MODES,
                LEVEL_SCORES,
                SORTED_LEVELS,
                applyFilters,
                selectedMode,
                showPlayerModal,
                showPlayerModalByName,
                closePlayerModal
            };
        })();
    </script>
</body>
</html>
