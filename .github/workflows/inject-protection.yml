name: Inject Protection

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject protection script
        run: |
          # 创建保护代码文件
          cat > /tmp/protection.html << 'EOF'
          <script>
          document.addEventListener("contextmenu",function(e){e.preventDefault()});
          document.addEventListener("keydown",function(e){
            if(e.key==="F12"||e.keyCode===123||(e.ctrlKey&&(e.key==="u"||e.keyCode===85))||(e.ctrlKey&&e.shiftKey&&(e.key==="I"||e.keyCode===73))||(e.ctrlKey&&e.shiftKey&&(e.key==="J"||e.keyCode===74))||(e.ctrlKey&&(e.key==="s"||e.keyCode===83))){e.preventDefault()}
          });
          document.addEventListener("selectstart",function(e){
            if(e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA")e.preventDefault()
          });
          document.addEventListener("dragstart",function(e){e.preventDefault()});
          document.addEventListener("copy",function(e){
            if(e.target.tagName!=="INPUT"&&e.target.tagName!=="TEXTAREA")e.preventDefault()
          });
          </script>
          <style>body{-webkit-user-select:none;user-select:none}</style>
          EOF
          
          PROTECTION=$(cat /tmp/protection.html)
          
          # 处理HTML文件
          find . -name "*.html" -type f | while read -r file; do
            if grep -q "data-protection-injected" "$file"; then
              echo "跳过已注入: $file"
              continue
            fi
            
            echo "注入: $file"
            # 使用awk插入代码
            awk -v p="$PROTECTION" '
              /<head>/ {
                print
                print p
                print "<!-- data-protection-injected -->"
                next
              }
              {print}
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "没有更改需要提交"
          else
            git commit -m "chore: inject protection scripts [skip ci]"
            git push
          fi
